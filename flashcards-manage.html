<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#b45309">

<title>بطاقات المراجعة | Atlas Platform</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
font-family:'Cairo',sans-serif;
background:
radial-gradient(circle at top right,rgba(217,119,6,.08),transparent 35%),
#f6f8fb;
color:#172033;
}

button,input,select,textarea{
font-family:inherit;
}

.topbar{
position:sticky;
top:0;
z-index:100;
background:rgba(255,255,255,.92);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
border-bottom:1px solid #e8edf2;
}

.topbar-inner{
max-width:1200px;
margin:auto;
padding:13px 18px;
display:flex;
align-items:center;
gap:11px;
}

.back{
width:42px;
height:42px;
border:0;
border-radius:14px;
background:white;
color:#64748b;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
box-shadow:0 5px 18px rgba(15,23,42,.06);
}

.back:hover{
color:#b45309;
}

.logo{
width:43px;
height:43px;
border-radius:14px;
background:linear-gradient(135deg,#f59e0b,#b45309);
color:white;
font-family:'Reem Kufi',sans-serif;
font-size:14px;
font-weight:700;
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 8px 20px rgba(217,119,6,.22);
}

.title{
display:flex;
flex-direction:column;
line-height:1.3;
}

.title strong{
font-size:14px;
font-weight:900;
}

.title span{
font-size:9px;
color:#94a3b8;
font-weight:700;
}

.main{
max-width:1200px;
margin:auto;
padding:22px 18px 60px;
}

.hero{
background:linear-gradient(135deg,#f59e0b,#b45309);
color:white;
border-radius:25px;
padding:22px;
position:relative;
overflow:hidden;
box-shadow:0 15px 35px rgba(217,119,6,.20);
}

.hero:after{
content:"";
position:absolute;
width:180px;
height:180px;
border-radius:50%;
background:rgba(255,255,255,.09);
left:-60px;
bottom:-90px;
}

.hero-content{
position:relative;
z-index:2;
}

.hero h1{
margin:0;
font-size:22px;
font-weight:900;
}

.hero p{
margin:6px 0 0;
font-size:10px;
font-weight:600;
opacity:.9;
}

.hero-stats{
display:flex;
gap:9px;
margin-top:17px;
flex-wrap:wrap;
}

.hero-stat{
background:rgba(255,255,255,.16);
border:1px solid rgba(255,255,255,.16);
padding:7px 11px;
border-radius:12px;
font-size:9px;
font-weight:800;
}

.form-card{
background:white;
border:1px solid #e8edf2;
border-radius:23px;
padding:18px;
margin-top:15px;
box-shadow:0 7px 25px rgba(15,23,42,.045);
}

.form-card h2{
margin:0 0 13px;
font-size:13px;
font-weight:900;
}

.form-grid{
display:grid;
grid-template-columns:1fr;
gap:10px;
}

.field label{
display:block;
font-size:9px;
font-weight:800;
color:#64748b;
margin-bottom:6px;
}

.field input,
.field select,
.field textarea{
width:100%;
padding:12px;
border:2px solid #eef2f6;
background:#f8fafc;
border-radius:14px;
outline:none;
font-size:11px;
font-weight:700;
resize:vertical;
}

.field textarea{
min-height:70px;
line-height:1.7;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
border-color:#f59e0b;
background:white;
}

.form-actions{
display:flex;
gap:9px;
margin-top:13px;
}

.btn{
border:0;
border-radius:14px;
padding:13px;
cursor:pointer;
font-size:11px;
font-weight:900;
display:flex;
align-items:center;
justify-content:center;
gap:7px;
}

.btn-primary{
flex:1;
background:linear-gradient(135deg,#f59e0b,#d97706);
color:white;
box-shadow:0 8px 20px rgba(217,119,6,.18);
}

.btn-cancel{
background:#f1f5f9;
color:#64748b;
padding:13px 16px;
}

.toolbar{
background:white;
border:1px solid #e8edf2;
border-radius:23px;
padding:16px;
margin-top:15px;
box-shadow:0 7px 25px rgba(15,23,42,.045);
}

.search{
position:relative;
}

.search i{
position:absolute;
right:14px;
top:50%;
transform:translateY(-50%);
color:#94a3b8;
font-size:12px;
}

.search input{
width:100%;
padding:13px 40px 13px 13px;
border:2px solid #eef2f6;
background:#f8fafc;
border-radius:15px;
outline:none;
font-size:11px;
font-weight:700;
}

.search input:focus{
border-color:#f59e0b;
background:white;
}

.filters{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
margin-top:10px;
}

.filters select{
width:100%;
padding:12px;
border:2px solid #eef2f6;
background:#f8fafc;
border-radius:14px;
outline:none;
font-size:10px;
font-weight:800;
}

.section-head{
display:flex;
align-items:center;
justify-content:space-between;
margin:20px 0 11px;
}

.section-head h2{
margin:0;
font-size:14px;
font-weight:900;
}

.count{
background:#fffbeb;
color:#b45309;
padding:6px 10px;
border-radius:11px;
font-size:9px;
font-weight:900;
}

.cards-list{
display:grid;
gap:12px;
}

.card-item{
background:white;
border:1px solid #e8edf2;
border-radius:21px;
padding:15px;
box-shadow:0 6px 22px rgba(15,23,42,.04);
}

.card-faces{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.card-face{
padding:10px 12px;
border-radius:13px;
font-size:10px;
font-weight:800;
line-height:1.7;
}

.card-face.front{
background:#fffbeb;
color:#92400e;
}

.card-face.back{
background:#f8fafc;
color:#475569;
}

.card-face span{
display:block;
font-size:8px;
font-weight:900;
opacity:.65;
margin-bottom:4px;
}

.meta{
display:flex;
flex-wrap:wrap;
gap:5px;
margin-top:10px;
}

.tag{
padding:4px 7px;
border-radius:8px;
background:#f1f5f9;
color:#64748b;
font-size:8px;
font-weight:800;
}

.card-actions{
display:flex;
gap:7px;
margin-top:12px;
padding-top:10px;
border-top:1px solid #f1f5f9;
}

.small-btn{
border:0;
border-radius:11px;
padding:8px 11px;
cursor:pointer;
font-size:9px;
font-weight:900;
}

.edit{
background:#eff6ff;
color:#2563eb;
}

.delete{
background:#fff1f2;
color:#e11d48;
}

.empty{
background:white;
border:1px dashed #cbd5e1;
border-radius:20px;
padding:45px 20px;
text-align:center;
color:#94a3b8;
}

.empty i{
font-size:35px;
margin-bottom:12px;
color:#cbd5e1;
}

.empty strong{
display:block;
font-size:12px;
color:#64748b;
}

.empty span{
display:block;
font-size:9px;
margin-top:5px;
}

.loading{
text-align:center;
padding:45px;
color:#94a3b8;
font-size:11px;
font-weight:800;
}

.loading i{
display:block;
font-size:25px;
margin-bottom:10px;
color:#f59e0b;
}

@media(min-width:700px){

.form-grid{
grid-template-columns:1fr 1fr;
}

.form-grid .full{
grid-column:1/-1;
}

.filters{
grid-template-columns:repeat(3,1fr);
}

.cards-list{
grid-template-columns:repeat(2,1fr);
}

}

</style>
</head>

<body>

<div class="topbar">
<div class="topbar-inner">

<button class="back" onclick="location.href='dashboard.html'">
<i class="fas fa-arrow-right"></i>
</button>

<div class="logo">A</div>

<div class="title">
<strong>بطاقات المراجعة</strong>
<span>إدارة بطاقات كل وحدة</span>
</div>

</div>
</div>


<main class="main">

<section class="hero">
<div class="hero-content">

<h1>بطاقات المراجعة السريعة</h1>
<p>أضف بطاقات مصطلح/سؤال وإجابة لكل وحدة ليراجعها الطلاب.</p>

<div class="hero-stats">

<div class="hero-stat" id="heroCount">0 بطاقة</div>

</div>

</div>
</section>


<section class="form-card">

<h2 id="formTitle">إضافة بطاقة جديدة</h2>

<div class="form-grid">

<div class="field">
<label>المرحلة</label>
<select id="cardStage">
<option value="primary">ابتدائي</option>
<option value="preparatory">إعدادي</option>
</select>
</div>

<div class="field">
<label>الصف</label>
<select id="cardGrade">
<option value="grade4">الرابع الابتدائي</option>
<option value="grade5">الخامس الابتدائي</option>
<option value="grade6">السادس الابتدائي</option>
<option value="grade7">الأول الإعدادي</option>
<option value="grade8">الثاني الإعدادي</option>
<option value="grade9">الثالث الإعدادي</option>
</select>
</div>

<div class="field">
<label>الوحدة</label>
<input id="cardUnit" placeholder="مثال: الوحدة الأولى">
</div>

<div class="field">
<label>الدرس (اختياري)</label>
<input id="cardLesson" placeholder="مثال: الدرس الأول">
</div>

<div class="field full">
<label>وجه البطاقة (سؤال / مصطلح)</label>
<textarea id="cardFront" placeholder="مثال: ما هي عاصمة مصر؟"></textarea>
</div>

<div class="field full">
<label>ظهر البطاقة (إجابة / شرح)</label>
<textarea id="cardBack" placeholder="مثال: القاهرة"></textarea>
</div>

</div>

<div class="form-actions">

<button class="btn btn-primary" id="saveCardButton">
<i class="fas fa-save"></i>
حفظ البطاقة
</button>

<button class="btn btn-cancel" id="cancelEditButton" style="display:none">
إلغاء
</button>

</div>

</section>


<section class="toolbar">

<div class="search">
<i class="fas fa-search"></i>
<input id="search" placeholder="ابحث في البطاقات...">
</div>

<div class="filters">

<select id="stageFilter">
<option value="">كل المراحل</option>
<option value="primary">ابتدائي</option>
<option value="preparatory">إعدادي</option>
</select>

<select id="gradeFilter">
<option value="">كل الصفوف</option>
<option value="grade4">الرابع الابتدائي</option>
<option value="grade5">الخامس الابتدائي</option>
<option value="grade6">السادس الابتدائي</option>
<option value="grade7">الأول الإعدادي</option>
<option value="grade8">الثاني الإعدادي</option>
<option value="grade9">الثالث الإعدادي</option>
</select>

<select id="unitFilter">
<option value="">كل الوحدات</option>
</select>

</div>

</section>


<div class="section-head">
<h2>البطاقات المحفوظة</h2>
<div class="count" id="resultCount">0 بطاقة</div>
</div>

<section id="cardsList" class="cards-list">
<div class="loading">
<i class="fas fa-spinner fa-spin"></i>
جاري تحميل البطاقات...
</div>
</section>

</main>


<script type="module">

import { auth, db } from "./firebase.js";

import {
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
collection,
addDoc,
updateDoc,
deleteDoc,
getDocs,
doc,
getDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


let allCards = [];
let editingId = null;


/* =========================================
AUTH
========================================= */

onAuthStateChanged(auth, async user => {

if(!user){
location.href="index.html";
return;
}

try{

const adminSnap = await getDoc(doc(db,"users",user.uid));

const allowed =
adminSnap.exists() &&
adminSnap.data().role==="admin";

if(!allowed){

await Swal.fire({
icon:"error",
title:"غير مسموح",
text:"هذه الصفحة مخصصة للإدارة فقط.",
confirmButtonColor:"#f59e0b"
});

location.href="index.html";
return;

}

loadCards();

}catch(error){

console.error(error);

Swal.fire({
icon:"error",
title:"خطأ",
text:"تعذر التحقق من صلاحيات الحساب.",
confirmButtonColor:"#f59e0b"
});

}

});


/* =========================================
LOAD
========================================= */

async function loadCards(){

const list = document.getElementById("cardsList");

try{

const snapshot = await getDocs(collection(db,"flashcards"));

allCards = [];

snapshot.forEach(item=>{
allCards.push({ id:item.id, ...item.data() });
});

allCards.sort((a,b)=>{
const x = a.createdAtMs || 0;
const y = b.createdAtMs || 0;
return y - x;
});

updateUnits();
renderCards();

}catch(error){

console.error(error);

list.innerHTML = `
<div class="empty">
<i class="fas fa-triangle-exclamation"></i>
<strong>تعذر تحميل البطاقات</strong>
<span>تأكد من إعدادات Firestore وقواعد الأمان.</span>
</div>
`;

}

}


/* =========================================
UNITS FILTER
========================================= */

function updateUnits(){

const select = document.getElementById("unitFilter");

const units = [
...new Set(
allCards.map(c=>c.unit).filter(Boolean)
)
];

select.innerHTML =
`<option value="">كل الوحدات</option>` +
units.map(u=>
`<option value="${escapeHtml(u)}">${escapeHtml(u)}</option>`
).join("");

}


/* =========================================
FILTER + RENDER
========================================= */

function getFiltered(){

const search =
document.getElementById("search").value.trim().toLowerCase();

const stage = document.getElementById("stageFilter").value;
const grade = document.getElementById("gradeFilter").value;
const unit = document.getElementById("unitFilter").value;

return allCards.filter(c=>{

const text = `
${c.front || ""}
${c.back || ""}
${c.unit || ""}
${c.lesson || ""}
`.toLowerCase();

return(
(!search || text.includes(search)) &&
(!stage || c.stage===stage) &&
(!grade || c.grade===grade) &&
(!unit || c.unit===unit)
);

});

}


function renderCards(){

const list = document.getElementById("cardsList");
const cards = getFiltered();

document.getElementById("resultCount").textContent = `${cards.length} بطاقة`;
document.getElementById("heroCount").textContent = `${allCards.length} بطاقة`;

if(!cards.length){

list.innerHTML = `
<div class="empty">
<i class="fas fa-folder-open"></i>
<strong>لا توجد بطاقات</strong>
<span>جرّب تغيير البحث أو الفلاتر أو أضف بطاقات جديدة.</span>
</div>
`;

return;

}

list.innerHTML = cards.map(c=>`

<article class="card-item">

<div class="card-faces">

<div class="card-face front">
<span>الوجه</span>
${escapeHtml(c.front || "")}
</div>

<div class="card-face back">
<span>الظهر</span>
${escapeHtml(c.back || "")}
</div>

</div>

<div class="meta">
${c.stage ? `<span class="tag">${stageName(c.stage)}</span>` : ""}
${c.grade ? `<span class="tag">${gradeName(c.grade)}</span>` : ""}
${c.unit ? `<span class="tag">${escapeHtml(c.unit)}</span>` : ""}
${c.lesson ? `<span class="tag">${escapeHtml(c.lesson)}</span>` : ""}
</div>

<div class="card-actions">

<button class="small-btn edit" onclick="editCard('${c.id}')">
<i class="fas fa-pen"></i> تعديل
</button>

<button class="small-btn delete" onclick="deleteCard('${c.id}')">
<i class="fas fa-trash"></i> حذف
</button>

</div>

</article>

`).join("");

}


["search","stageFilter","gradeFilter","unitFilter"].forEach(id=>{
document.getElementById(id).addEventListener("input", renderCards);
document.getElementById(id).addEventListener("change", renderCards);
});


/* =========================================
SAVE (ADD / EDIT)
========================================= */

document.getElementById("saveCardButton").addEventListener("click", async ()=>{

const stage = document.getElementById("cardStage").value;
const grade = document.getElementById("cardGrade").value;
const unit = document.getElementById("cardUnit").value.trim();
const lesson = document.getElementById("cardLesson").value.trim();
const front = document.getElementById("cardFront").value.trim();
const back = document.getElementById("cardBack").value.trim();

if(!unit || !front || !back){

Swal.fire({
icon:"warning",
title:"بيانات ناقصة",
text:"اكتب الوحدة ووجه البطاقة وظهرها على الأقل.",
confirmButtonColor:"#f59e0b"
});

return;

}

const button = document.getElementById("saveCardButton");
button.disabled = true;
button.innerHTML = `<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...`;

try{

if(editingId){

await updateDoc(doc(db,"flashcards",editingId), {
stage, grade, unit, lesson, front, back,
updatedAt: serverTimestamp()
});

await Swal.fire({
icon:"success",
title:"تم التعديل",
text:"تم تحديث البطاقة.",
confirmButtonColor:"#f59e0b"
});

}else{

await addDoc(collection(db,"flashcards"), {
stage, grade, unit, lesson, front, back,
createdAtMs: Date.now(),
createdAt: serverTimestamp()
});

await Swal.fire({
icon:"success",
title:"تمت الإضافة",
text:"تمت إضافة البطاقة إلى بنك المراجعة.",
confirmButtonColor:"#f59e0b"
});

}

resetForm();
await loadCards();

}catch(error){

console.error(error);

Swal.fire({
icon:"error",
title:"تعذر الحفظ",
text:"حدث خطأ أثناء حفظ البطاقة.",
confirmButtonColor:"#f59e0b"
});

}

button.disabled = false;
button.innerHTML = `<i class="fas fa-save"></i> حفظ البطاقة`;

});


window.editCard = function(id){

const card = allCards.find(c=>c.id===id);
if(!card) return;

editingId = id;

document.getElementById("cardStage").value = card.stage || "primary";
document.getElementById("cardGrade").value = card.grade || "grade4";
document.getElementById("cardUnit").value = card.unit || "";
document.getElementById("cardLesson").value = card.lesson || "";
document.getElementById("cardFront").value = card.front || "";
document.getElementById("cardBack").value = card.back || "";

document.getElementById("formTitle").textContent = "تعديل البطاقة";
document.getElementById("cancelEditButton").style.display = "flex";

window.scrollTo({ top:0, behavior:"smooth" });

};


document.getElementById("cancelEditButton").addEventListener("click", resetForm);


function resetForm(){

editingId = null;

document.getElementById("cardUnit").value = "";
document.getElementById("cardLesson").value = "";
document.getElementById("cardFront").value = "";
document.getElementById("cardBack").value = "";

document.getElementById("formTitle").textContent = "إضافة بطاقة جديدة";
document.getElementById("cancelEditButton").style.display = "none";

}


window.deleteCard = async function(id){

const result = await Swal.fire({
icon:"warning",
title:"حذف البطاقة؟",
text:"لا يمكن التراجع عن هذا الإجراء.",
showCancelButton:true,
confirmButtonText:"حذف",
cancelButtonText:"إلغاء",
confirmButtonColor:"#ef4444",
cancelButtonColor:"#64748b"
});

if(!result.isConfirmed) return;

try{

await deleteDoc(doc(db,"flashcards",id));
await loadCards();

}catch(error){

console.error(error);

Swal.fire({
icon:"error",
title:"تعذر الحذف",
text:"حدث خطأ أثناء حذف البطاقة.",
confirmButtonColor:"#f59e0b"
});

}

};


/* =========================================
NAMES
========================================= */

function stageName(stage){
return stage==="primary" ? "ابتدائي" : stage==="preparatory" ? "إعدادي" : stage;
}

function gradeName(grade){

const map = {
grade4:"الرابع الابتدائي",
grade5:"الخامس الابتدائي",
grade6:"السادس الابتدائي",
grade7:"الأول الإعدادي",
grade8:"الثاني الإعدادي",
grade9:"الثالث الإعدادي"
};

return map[grade] || grade;

}


function escapeHtml(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
