<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <meta name="theme-color" content="#10b981">

    <title>نتائج الطلاب | Atlas Platform</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Reem+Kufi:wght@600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: 'Cairo', sans-serif;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(16,185,129,.08),
                    transparent 35%
                ),
                #f6f8fb;

            color: #172033;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;

            background: rgba(255,255,255,.92);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border-bottom: 1px solid #e8edf2;
        }

        .topbar-inner {
            max-width: 1200px;
            margin: auto;
            padding: 14px 18px;

            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back {
            width: 42px;
            height: 42px;

            border: 0;
            border-radius: 14px;

            background: white;
            color: #64748b;

            cursor: pointer;

            box-shadow:
                0 5px 18px rgba(15,23,42,.06);
        }

        .back:hover {
            color: #10b981;
        }

        .logo {
            width: 44px;
            height: 44px;

            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #10b981,
                    #059669
                );

            color: white;

            font-family: 'Reem Kufi', sans-serif;

            font-weight: 700;

            box-shadow:
                0 8px 20px rgba(16,185,129,.20);
        }

        .title {
            display: flex;
            flex-direction: column;
            line-height: 1.3;
        }

        .title strong {
            font-size: 14px;
            font-weight: 900;
        }

        .title span {
            font-size: 9px;
            color: #94a3b8;
            font-weight: 700;
        }

        .main {
            max-width: 1200px;
            margin: auto;
            padding: 25px 18px 50px;
        }

        .hero {
            position: relative;
            overflow: hidden;

            padding: 25px;

            border-radius: 27px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #10b981,
                    #047857
                );

            box-shadow:
                0 18px 40px rgba(16,185,129,.18);
        }

        .hero::before {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            border-radius: 50%;

            background:
                rgba(255,255,255,.07);

            left: -70px;
            top: -90px;
        }

        .hero::after {
            content: "";

            position: absolute;

            width: 150px;
            height: 150px;

            border-radius: 50%;

            background:
                rgba(255,255,255,.05);

            right: -60px;
            bottom: -80px;
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .hero h1 {
            margin: 0;

            font-size: 23px;
            font-weight: 900;
        }

        .hero p {
            margin: 7px 0 0;

            font-size: 10px;
            font-weight: 600;

            opacity: .88;
        }

        .stats {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 12px;

            margin-top: 18px;
        }

        .stat {
            background: white;

            border:
                1px solid #e8edf2;

            border-radius: 21px;

            padding: 17px;

            box-shadow:
                0 6px 22px rgba(15,23,42,.045);
        }

        .stat-icon {
            width: 40px;
            height: 40px;

            border-radius: 13px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ecfdf5;
            color: #059669;
        }

        .stat-number {
            margin-top: 10px;

            font-size: 23px;
            font-weight: 900;
        }

        .stat-label {
            font-size: 9px;

            color: #94a3b8;

            font-weight: 700;
        }

        .card {
            margin-top: 18px;

            background: white;

            border:
                1px solid #e8edf2;

            border-radius: 25px;

            padding: 20px;

            box-shadow:
                0 8px 28px rgba(15,23,42,.045);
        }

        .card-title {
            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 17px;
        }

        .card-icon {
            width: 40px;
            height: 40px;

            border-radius: 13px;

            background: #dcfce7;

            color: #059669;

            display: flex;

            align-items: center;
            justify-content: center;
        }

        .card-title strong {
            display: block;

            font-size: 13px;
            font-weight: 900;
        }

        .card-title span {
            display: block;

            font-size: 8px;

            color: #94a3b8;

            font-weight: 700;

            margin-top: 2px;
        }

        .filters {
            display: grid;

            grid-template-columns: 1fr;

            gap: 10px;
        }

        input,
        select {
            width: 100%;

            padding: 13px 14px;

            border-radius: 15px;

            border:
                2px solid #eef2f6;

            background: #f8fafc;

            outline: none;

            font-size: 10px;

            font-weight: 700;

            transition: .2s;
        }

        input:focus,
        select:focus {
            border-color: #10b981;

            background: white;

            box-shadow:
                0 7px 18px rgba(16,185,129,.08);
        }

        .results-list {
            display: grid;

            gap: 10px;
        }

        .result {
            border:
                1px solid #e8edf2;

            border-radius: 18px;

            padding: 15px;

            background: #fbfdfe;
        }

        .result-top {
            display: flex;

            align-items: center;

            gap: 11px;
        }

        .avatar {
            flex: 0 0 44px;

            width: 44px;
            height: 44px;

            border-radius: 14px;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #10b981,
                    #059669
                );

            color: white;

            font-weight: 900;
        }

        .result-info {
            flex: 1;

            min-width: 0;
        }

        .result-info strong {
            display: block;

            font-size: 11px;

            font-weight: 900;
        }

        .result-info span {
            display: block;

            margin-top: 3px;

            font-size: 8px;

            color: #94a3b8;

            font-weight: 700;
        }

        .score {
            min-width: 62px;

            text-align: center;

            padding: 8px;

            border-radius: 12px;

            background: #ecfdf5;

            color: #047857;
        }

        .score strong {
            display: block;

            font-size: 14px;

            font-weight: 900;
        }

        .score span {
            font-size: 7px;

            font-weight: 700;
        }

        .result-bottom {
            display: flex;

            flex-wrap: wrap;

            gap: 6px;

            margin-top: 12px;

            padding-top: 10px;

            border-top:
                1px solid #eef2f6;
        }

        .badge {
            padding: 5px 8px;

            border-radius: 9px;

            background: #f1f5f9;

            color: #64748b;

            font-size: 7px;

            font-weight: 800;
        }

        .empty {
            text-align: center;

            padding: 40px 15px;

            color: #94a3b8;

            font-size: 10px;

            font-weight: 800;
        }

        .loading {
            text-align: center;

            padding: 30px;

            color: #94a3b8;
        }

        @media (min-width:700px) {

            .stats {
                grid-template-columns:
                    repeat(4, 1fr);
            }

            .filters {
                grid-template-columns:
                    2fr 1fr 1fr;
            }

            .hero {
                padding: 30px;
            }

            .hero h1 {
                font-size: 26px;
            }

        }

    </style>

</head>


<body>


<header class="topbar">

    <div class="topbar-inner">

        <button
            class="back"
            onclick="location.href='dashboard.html'">

            <i class="fas fa-arrow-right"></i>

        </button>


        <div class="logo">
            أطلس
        </div>


        <div class="title">

            <strong>
                نتائج الطلاب
            </strong>

            <span>
                Atlas Platform
            </span>

        </div>

    </div>

</header>



<main class="main">


    <section class="hero">

        <div class="hero-content">

            <h1>
                نتائج الطلاب 📊
            </h1>

            <p>
                متابعة أداء الطلاب ونتائج الاختبارات من مكان واحد.
            </p>

        </div>

    </section>



    <!-- =================================
         STATISTICS
    ================================== -->

    <section class="stats">


        <div class="stat">

            <div class="stat-icon">

                <i class="fas fa-list-check"></i>

            </div>

            <div
                class="stat-number"
                id="totalAttempts">

                0

            </div>

            <div class="stat-label">
                إجمالي المحاولات
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">

                <i class="fas fa-chart-line"></i>

            </div>

            <div
                class="stat-number"
                id="averageScore">

                0%

            </div>

            <div class="stat-label">
                متوسط الدرجات
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">

                <i class="fas fa-trophy"></i>

            </div>

            <div
                class="stat-number"
                id="highestScore">

                0%

            </div>

            <div class="stat-label">
                أعلى نتيجة
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">

                <i class="fas fa-users"></i>

            </div>

            <div
                class="stat-number"
                id="uniqueStudents">

                0

            </div>

            <div class="stat-label">
                طلاب شاركوا
            </div>

        </div>


    </section>



    <!-- =================================
         FILTERS
    ================================== -->

    <section class="card">


        <div class="card-title">

            <div class="card-icon">

                <i class="fas fa-filter"></i>

            </div>


            <div>

                <strong>
                    البحث والتصفية
                </strong>

                <span>
                    ابحث في نتائج الاختبارات
                </span>

            </div>

        </div>



        <div class="filters">


            <input
                id="searchInput"
                placeholder="ابحث باسم الطالب أو الاختبار...">


            <select id="gradeFilter">

                <option value="">
                    كل الصفوف
                </option>

                <option value="grade4">
                    الرابع الابتدائي
                </option>

                <option value="grade5">
                    الخامس الابتدائي
                </option>

                <option value="grade6">
                    السادس الابتدائي
                </option>

                <option value="grade7">
                    الأول الإعدادي
                </option>

                <option value="grade8">
                    الثاني الإعدادي
                </option>

                <option value="grade9">
                    الثالث الإعدادي
                </option>

            </select>


            <select id="resultFilter">

                <option value="">
                    كل النتائج
                </option>

                <option value="excellent">
                    90% فأكثر
                </option>

                <option value="good">
                    من 70% إلى 89%
                </option>

                <option value="weak">
                    أقل من 70%
                </option>

            </select>


        </div>

    </section>



    <!-- =================================
         RESULTS
    ================================== -->

    <section class="card">


        <div class="card-title">

            <div class="card-icon">

                <i class="fas fa-ranking-star"></i>

            </div>


            <div>

                <strong>
                    سجل النتائج
                </strong>

                <span id="resultsInfo">
                    جاري التحميل...
                </span>

            </div>

        </div>


        <div
            id="resultsList"
            class="results-list">

            <div class="loading">

                <i class="fas fa-spinner fa-spin"></i>

                جاري تحميل النتائج...

            </div>

        </div>


    </section>


</main>



<script type="module">


/* =========================================
   FIREBASE
========================================= */

import {
    auth,
    db
} from "./firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    collection,
    getDocs,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



let currentUser = null;

let results = [];



/* =========================================
   AUTH + ADMIN
========================================= */

onAuthStateChanged(
    auth,
    async user => {


        if (!user) {

            location.href =
                "index.html";

            return;

        }


        currentUser = user;


        try {


            const userSnap =
                await getDoc(
                    doc(
                        db,
                        "users",
                        user.uid
                    )
                );


            if (
                !userSnap.exists() ||
                userSnap.data().role !== "admin"
            ) {


                await Swal.fire({

                    icon:
                        "error",

                    title:
                        "غير مسموح",

                    text:
                        "هذه الصفحة مخصصة للإدارة فقط.",

                    confirmButtonColor:
                        "#10b981"

                });


                location.href =
                    "index.html";

                return;

            }


            loadResults();


        } catch (error) {

            console.error(error);

        }

    }
);



/* =========================================
   LOAD RESULTS
========================================= */

async function loadResults() {


    const list =
        document.getElementById(
            "resultsList"
        );


    try {


        const snapshot =
            await getDocs(
                collection(
                    db,
                    "attempts"
                )
            );


        results =
            snapshot.docs.map(
                item => ({

                    id:
                        item.id,

                    ...item.data()

                })
            );


        /*
           ترتيب الأحدث أولاً
        */

        results.sort(
            (a,b) => {

                const dateA =
                    getTime(a.createdAt);

                const dateB =
                    getTime(b.createdAt);

                return dateB - dateA;

            }
        );


        updateStatistics();

        renderResults();


    } catch (error) {


        console.error(
            "Results Error:",
            error
        );


        list.innerHTML = `

            <div class="empty">

                حدث خطأ أثناء تحميل النتائج.

            </div>

        `;

    }

}



/* =========================================
   STATISTICS
========================================= */

function updateStatistics() {


    const total =
        results.length;


    const percentages =
        results
            .map(
                r => getPercentage(r)
            )
            .filter(
                n => !isNaN(n)
            );


    const average =
        percentages.length
        ?
        percentages.reduce(
            (a,b) => a + b,
            0
        ) / percentages.length
        :
        0;


    const highest =
        percentages.length
        ?
        Math.max(...percentages)
        :
        0;


    const unique =
        new Set(

            results
                .map(
                    r =>
                        r.studentId ||
                        r.userId ||
                        r.uid ||
                        r.studentName
                )
                .filter(Boolean)

        ).size;


    document.getElementById(
        "totalAttempts"
    ).textContent =
        total;


    document.getElementById(
        "averageScore"
    ).textContent =
        `${Math.round(average)}%`;


    document.getElementById(
        "highestScore"
    ).textContent =
        `${Math.round(highest)}%`;


    document.getElementById(
        "uniqueStudents"
    ).textContent =
        unique;

}



/* =========================================
   RENDER
========================================= */

function renderResults() {


    const list =
        document.getElementById(
            "resultsList"
        );


    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    const grade =
        document.getElementById(
            "gradeFilter"
        ).value;


    const resultType =
        document.getElementById(
            "resultFilter"
        ).value;



    const filtered =
        results.filter(
            result => {


                const studentName =
                    String(
                        result.studentName ||
                        result.name ||
                        ""
                    )
                    .toLowerCase();


                const examName =
                    String(
                        result.examTitle ||
                        result.examName ||
                        result.title ||
                        ""
                    )
                    .toLowerCase();


                const matchesSearch =
                    !search ||
                    studentName.includes(search) ||
                    examName.includes(search);


                const matchesGrade =
                    !grade ||
                    result.grade === grade;


                const percentage =
                    getPercentage(result);


                let matchesResult =
                    true;


                if (
                    resultType ===
                    "excellent"
                ) {

                    matchesResult =
                        percentage >= 90;

                }


                if (
                    resultType ===
                    "good"
                ) {

                    matchesResult =
                        percentage >= 70 &&
                        percentage < 90;

                }


                if (
                    resultType ===
                    "weak"
                ) {

                    matchesResult =
                        percentage < 70;

                }


                return (
                    matchesSearch &&
                    matchesGrade &&
                    matchesResult
                );

            }
        );



    document.getElementById(
        "resultsInfo"
    ).textContent =
        `${filtered.length} نتيجة`;



    if (!filtered.length) {

        list.innerHTML = `

            <div class="empty">

                <i
                    class="fas fa-chart-column"
                    style="font-size:30px;margin-bottom:10px">
                </i>

                <br>

                لا توجد نتائج مطابقة.

            </div>

        `;

        return;

    }



    list.innerHTML =
        filtered
        .map(
            result => {


                const student =
                    result.studentName ||
                    result.name ||
                    "طالب";


                const exam =
                    result.examTitle ||
                    result.examName ||
                    result.title ||
                    "اختبار";


                const percentage =
                    getPercentage(
                        result
                    );


                const score =
                    getScore(
                        result
                    );


                const first =
                    student
                    .trim()
                    .charAt(0);


                return `

                    <div class="result">

                        <div class="result-top">


                            <div class="avatar">

                                ${escapeHtml(first)}

                            </div>


                            <div class="result-info">

                                <strong>

                                    ${escapeHtml(student)}

                                </strong>


                                <span>

                                    ${escapeHtml(exam)}

                                </span>

                            </div>


                            <div class="score">

                                <strong>

                                    ${Math.round(
                                        percentage
                                    )}%

                                </strong>

                                <span>
                                    النتيجة
                                </span>

                            </div>


                        </div>


                        <div class="result-bottom">


                            <span class="badge">

                                <i class="fas fa-star"></i>

                                ${score}

                            </span>


                            ${
                                result.grade
                                ?
                                `
                                <span class="badge">

                                    ${gradeName(
                                        result.grade
                                    )}

                                </span>
                                `
                                :
                                ""
                            }


                            <span class="badge">

                                <i class="fas fa-calendar"></i>

                                ${formatDate(
                                    result.createdAt
                                )}

                            </span>


                        </div>

                    </div>

                `;

            }
        )
        .join("");

}



/* =========================================
   PERCENTAGE
========================================= */

function getPercentage(result) {


    if (
        typeof result.percentage ===
        "number"
    ) {

        return result.percentage;

    }


    const score =
        Number(
            result.score ??
            result.correctAnswers ??
            result.correct ??
            0
        );


    const total =
        Number(
            result.total ??
            result.totalQuestions ??
            result.maxScore ??
            0
        );


    if (!total)
        return 0;


    return (
        score /
        total
    ) * 100;

}



/* =========================================
   SCORE
========================================= */

function getScore(result) {


    const score =
        result.score ??
        result.correctAnswers ??
        result.correct ??
        0;


    const total =
        result.total ??
        result.totalQuestions ??
        result.maxScore ??
        "";


    if (total !== "") {

        return `${score} / ${total}`;

    }


    return score;

}



/* =========================================
   DATE
========================================= */

function getTime(timestamp) {


    if (!timestamp)
        return 0;


    if (
        typeof timestamp.toMillis ===
        "function"
    ) {

        return timestamp.toMillis();

    }


    return new Date(
        timestamp
    ).getTime() || 0;

}



function formatDate(timestamp) {


    const time =
        getTime(timestamp);


    if (!time)
        return "غير محدد";


    return new Intl.DateTimeFormat(
        "ar-EG",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    ).format(
        new Date(time)
    );

}



/* =========================================
   GRADE
========================================= */

function gradeName(grade) {


    const map = {

        grade4:
            "الرابع الابتدائي",

        grade5:
            "الخامس الابتدائي",

        grade6:
            "السادس الابتدائي",

        grade7:
            "الأول الإعدادي",

        grade8:
            "الثاني الإعدادي",

        grade9:
            "الثالث الإعدادي"

    };


    return map[grade] ||
           grade;

}



/* =========================================
   SEARCH
========================================= */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        renderResults
    );


document
    .getElementById(
        "gradeFilter"
    )
    .addEventListener(
        "change",
        renderResults
    );


document
    .getElementById(
        "resultFilter"
    )
    .addEventListener(
        "change",
        renderResults
    );



/* =========================================
   ESCAPE
========================================= */

function escapeHtml(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>

</body>

</html>
