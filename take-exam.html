<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#10b981">

    <title>حل الاختبار | Atlas Platform</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Reem+Kufi:wght@600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: 'Cairo', sans-serif;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(16,185,129,.08),
                    transparent 35%
                ),
                #f6f8fb;
            color: #172033;
        }

        button {
            font-family: inherit;
        }

        #pageLoader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader-logo {
            width: 72px;
            height: 72px;
            margin: auto;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg,#10b981,#047857);
            color: white;
            font-family: 'Reem Kufi';
            font-size: 22px;
            box-shadow: 0 18px 40px rgba(16,185,129,.25);
            animation: pulse 1.4s infinite;
        }

        @keyframes pulse {
            0%,100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255,255,255,.94);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid #e8edf2;
        }

        .topbar-inner {
            max-width: 800px;
            margin: auto;
            padding: 13px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .exam-title {
            display: flex;
            flex-direction: column;
            line-height: 1.3;
            min-width: 0;
        }

        .exam-title strong {
            font-size: 12px;
            font-weight: 900;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .exam-title span {
            font-size: 8px;
            color: #94a3b8;
            font-weight: 700;
        }

        .progress-bar {
            height: 5px;
            background: #f1f5f9;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg,#10b981,#059669);
            transition: width .3s ease;
        }

        .main {
            max-width: 800px;
            margin: auto;
            padding: 20px 18px 100px;
        }

        .q-counter {
            text-align: center;
            font-size: 10px;
            font-weight: 900;
            color: #94a3b8;
            margin-bottom: 14px;
        }

        .question-card {
            background: white;
            border: 1px solid #e8edf2;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(15,23,42,.05);
        }

        .question-text {
            font-size: 13px;
            font-weight: 900;
            line-height: 2;
            color: #1e293b;
        }

        .options {
            display: grid;
            gap: 10px;
            margin-top: 18px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border: 2px solid #eef2f6;
            border-radius: 16px;
            background: #f8fafc;
            cursor: pointer;
            transition: .18s;
        }

        .option:hover {
            border-color: #a7f3d0;
        }

        .option.selected {
            background: #ecfdf5;
            border-color: #10b981;
        }

        .option-letter {
            flex: 0 0 30px;
            width: 30px;
            height: 30px;
            border-radius: 10px;
            background: white;
            border: 2px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 900;
            color: #64748b;
        }

        .option.selected .option-letter {
            background: #10b981;
            border-color: #10b981;
            color: white;
        }

        .option-text {
            font-size: 11px;
            font-weight: 700;
            color: #334155;
        }

        .nav-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .nav-btn {
            border: 0;
            border-radius: 16px;
            padding: 14px;
            font-size: 11px;
            font-weight: 900;
            cursor: pointer;
        }

        .nav-prev {
            background: #f1f5f9;
            color: #475569;
        }

        .nav-prev:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        .nav-next {
            background: linear-gradient(135deg,#10b981,#059669);
            color: white;
            box-shadow: 0 10px 22px rgba(16,185,129,.18);
        }

        .nav-next:disabled {
            background: #cbd5e1;
            color: #64748b;
            box-shadow: none;
            cursor: not-allowed;
        }

        .nav-submit {
            background: linear-gradient(135deg,#f59e0b,#d97706);
            color: white;
            box-shadow: 0 10px 22px rgba(245,158,11,.2);
        }

        .dots {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            justify-content: center;
            margin-top: 20px;
        }

        .dot {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            border: 0;
            background: #f1f5f9;
            color: #94a3b8;
            font-size: 9px;
            font-weight: 900;
            cursor: pointer;
        }

        .dot.answered {
            background: #dcfce7;
            color: #059669;
        }

        .dot.current {
            background: #10b981;
            color: white;
        }

        .dot.locked {
            background: #f1f5f9;
            color: #cbd5e1;
            cursor: not-allowed;
        }

        .empty {
            background: white;
            border: 1px dashed #cbd5e1;
            border-radius: 22px;
            padding: 40px 20px;
            text-align: center;
            color: #94a3b8;
        }

        .empty i {
            font-size: 30px;
            margin-bottom: 10px;
            color: #cbd5e1;
        }

    </style>
</head>


<body>


<div id="pageLoader">

    <div class="loader-logo">
        أطلس
    </div>

</div>


<header class="topbar">

    <div class="topbar-inner">

        <div class="exam-title">

            <strong id="examTitleText">
                جاري التحميل...
            </strong>

            <span id="examSubText">
                Atlas Platform
            </span>

        </div>

    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

</header>


<main class="main" id="examContainer">

    <div class="empty">

        <i class="fas fa-spinner fa-spin"></i>

        <strong>جاري تحميل الاختبار...</strong>

    </div>

</main>


<script type="module">

import {
    auth,
    db
} from "./firebase.js";

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    doc,
    getDoc,
    collection,
    getDocs,
    query,
    where,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


let currentUser = null;

let studentData = null;

let exam = null;

let examId = null;

let answers = {};

let currentIndex = 0;

let submitted = false;


/* =========================================
   GET examId FROM URL
========================================= */

const params =
    new URLSearchParams(window.location.search);

examId = params.get("examId");


if (!examId) {

    document.getElementById("examContainer").innerHTML = `

        <div class="empty">

            <i class="fas fa-triangle-exclamation"></i>

            <strong>لم يتم تحديد اختبار</strong>

        </div>

    `;

}


/* =========================================
   AUTH GUARD
========================================= */

onAuthStateChanged(auth, async user => {

    if (!user) {

        window.location.href = "index.html";

        return;
    }


    try {

        const userSnap =
            await getDoc(
                doc(db, "users", user.uid)
            );


        if (
            !userSnap.exists() ||
            userSnap.data().role !== "student"
        ) {

            await signOut(auth);

            window.location.href = "index.html";

            return;

        }


        currentUser = user;

        studentData = userSnap.data();


        if (examId) {

            await loadExam();

        }


        hideLoader();


    } catch (error) {

        console.error(error);

        hideLoader();

        Swal.fire({

            icon: "error",

            title: "حدث خطأ",

            text: "تعذر تحميل بيانات حسابك.",

            confirmButtonColor: "#10b981"

        });

    }

});


/* =========================================
   LOAD EXAM
========================================= */

async function loadExam() {

    const container =
        document.getElementById("examContainer");

    try {

        const examSnap =
            await getDoc(
                doc(db, "exams", examId)
            );


        if (!examSnap.exists()) {

            container.innerHTML = `

                <div class="empty">

                    <i class="fas fa-circle-exclamation"></i>

                    <strong>الاختبار غير موجود</strong>

                </div>

            `;

            return;

        }


        exam = {
            id: examSnap.id,
            ...examSnap.data()
        };


        /*
           التأكد من أن الاختبار يخص صف
           الطالب فعلاً، ومنشور.
        */

        if (
            exam.grade !== studentData.grade ||
            exam.isPublished !== true
        ) {

            container.innerHTML = `

                <div class="empty">

                    <i class="fas fa-lock"></i>

                    <strong>هذا الاختبار غير متاح لك</strong>

                </div>

            `;

            return;

        }


        /*
           التأكد من عدم وجود محاولة سابقة
        */

        const attemptsQuery =
            query(

                collection(db, "attempts"),

                where("studentId", "==", currentUser.uid),

                where("examId", "==", examId)

            );


        const attemptsSnap =
            await getDocs(attemptsQuery);


        if (!attemptsSnap.empty) {

            container.innerHTML = `

                <div class="empty">

                    <i class="fas fa-circle-check"></i>

                    <strong>لقد قمت بحل هذا الاختبار من قبل</strong>

                    <div style="margin-top:14px">

                        <button
                            class="nav-btn nav-next"
                            style="padding:11px 20px"
                            onclick="window.location.href='student-dashboard.html'">

                            الرجوع للوحة الطالب

                        </button>

                    </div>

                </div>

            `;

            return;

        }


        document.getElementById("examTitleText")
            .textContent = exam.title || "اختبار";

        document.getElementById("examSubText")
            .textContent =
                `${exam.questionCount || (exam.questions || []).length} سؤال`;


        renderQuestion();


        window.addEventListener(
            "beforeunload",
            beforeUnloadHandler
        );


    } catch (error) {

        console.error(error);

        container.innerHTML = `

            <div class="empty">

                <i class="fas fa-triangle-exclamation"></i>

                <strong>تعذر تحميل الاختبار</strong>

            </div>

        `;

    }

}


function beforeUnloadHandler(event) {

    if (submitted) return;

    event.preventDefault();

    event.returnValue = "";

}


/* =========================================
   RENDER QUESTION
========================================= */

function renderQuestion() {

    const questions =
        exam.questions || [];

    const q =
        questions[currentIndex];

    if (!q) return;


    const container =
        document.getElementById("examContainer");


    const total =
        questions.length;


    document.getElementById("progressFill")
        .style.width =
            `${((currentIndex + 1) / total) * 100}%`;


    const options = [

        ["A", "أ", q.options?.A],
        ["B", "ب", q.options?.B],
        ["C", "ج", q.options?.C],
        ["D", "د", q.options?.D]

    ];


    const selectedAnswer =
        answers[q.id];

    const isAnswered =
        Boolean(selectedAnswer);


    container.innerHTML = `

        <div class="q-counter">
            السؤال ${currentIndex + 1} من ${total}
        </div>


        <div class="question-card">

            <div class="question-text">
                ${escapeHtml(q.text || "")}
            </div>


            <div class="options" id="optionsBox">

                ${options.map(o => `

                    <div
                        class="option ${selectedAnswer === o[0] ? "selected" : ""}"
                        data-value="${o[0]}"
                        onclick="selectAnswer('${q.id}','${o[0]}')">

                        <div class="option-letter">
                            ${o[1]}
                        </div>

                        <div class="option-text">
                            ${escapeHtml(o[2] || "")}
                        </div>

                    </div>

                `).join("")}

            </div>


            <div class="nav-buttons">

                <button
                    class="nav-btn nav-prev"
                    id="prevBtn"
                    ${currentIndex === 0 ? "disabled" : ""}
                    onclick="goPrev()">

                    <i class="fas fa-arrow-right"></i>
                    السابق

                </button>

                ${

                    currentIndex === total - 1
                    ?
                    `<button
                        class="nav-btn nav-submit"
                        onclick="confirmSubmit()">

                        <i class="fas fa-paper-plane"></i>
                        تسليم الاختبار

                    </button>`
                    :
                    `<button
                        class="nav-btn nav-next"
                        ${isAnswered ? "" : "disabled"}
                        onclick="goNext()">

                        التالي
                        <i class="fas fa-arrow-left"></i>

                    </button>`

                }

            </div>

            ${
                !isAnswered
                ? `<div style="text-align:center;font-size:9px;font-weight:800;color:#c2410c;margin-top:10px">
                     <i class="fas fa-circle-exclamation"></i>
                     جاوب على السؤال الحالي عشان تقدر تكمل
                   </div>`
                : ""
            }


            <div class="dots" id="dotsBox">

                ${questions.map((question,i) => `

                    <button
                        class="dot
                            ${answers[question.id] ? "answered" : ""}
                            ${i === currentIndex ? "current" : ""}
                            ${i > currentIndex ? "locked" : ""}"
                        ${i > currentIndex ? "disabled" : ""}
                        onclick="goTo(${i})">

                        ${i > currentIndex
                            ? '<i class="fas fa-lock" style="font-size:8px"></i>'
                            : i + 1}

                    </button>

                `).join("")}

            </div>

        </div>

    `;

}


/* =========================================
   SELECT ANSWER
========================================= */

window.selectAnswer = function(questionId, value) {

    answers[questionId] = value;

    renderQuestion();

};


/* =========================================
   NAVIGATION
========================================= */

window.goNext = function() {

    const questions = exam.questions || [];

    const currentQuestion = questions[currentIndex];

    if (!currentQuestion || !answers[currentQuestion.id]) {

        Swal.fire({

            icon: "warning",

            title: "جاوب على السؤال أولاً",

            text: "لازم تختار إجابة قبل ما تنتقل للسؤال التالي.",

            confirmButtonColor: "#10b981"

        });

        return;

    }

    if (currentIndex < questions.length - 1) {

        currentIndex++;

        renderQuestion();

        window.scrollTo({ top:0, behavior:"smooth" });

    }

};


window.goPrev = function() {

    if (currentIndex > 0) {

        currentIndex--;

        renderQuestion();

        window.scrollTo({ top:0, behavior:"smooth" });

    }

};


window.goTo = function(index) {

    if (index > currentIndex) return;

    currentIndex = index;

    renderQuestion();

    window.scrollTo({ top:0, behavior:"smooth" });

};


/* =========================================
   CONFIRM SUBMIT
========================================= */

window.confirmSubmit = async function() {

    const questions =
        exam.questions || [];

    const answeredCount =
        Object.keys(answers).length;

    const unanswered =
        questions.length - answeredCount;


    const result =
        await Swal.fire({

            icon: unanswered > 0 ? "warning" : "question",

            title: "تسليم الاختبار؟",

            html:
                unanswered > 0
                ? `لديك <b>${unanswered}</b> سؤال بدون إجابة. هل تريد التسليم الآن؟`
                : "هل أنت متأكد من تسليم إجاباتك؟",

            showCancelButton: true,

            confirmButtonText: "تسليم",

            cancelButtonText: "رجوع",

            confirmButtonColor: "#10b981",

            cancelButtonColor: "#64748b"

        });


    if (!result.isConfirmed) return;


    submitExam(false);

};


/* =========================================
   SUBMIT EXAM
========================================= */

async function submitExam(autoSubmitted) {

    if (submitted) return;

    submitted = true;


    window.removeEventListener(
        "beforeunload",
        beforeUnloadHandler
    );


    const container =
        document.getElementById("examContainer");

    container.innerHTML = `

        <div class="empty">

            <i class="fas fa-spinner fa-spin"></i>

            <strong>جاري تسليم إجاباتك...</strong>

        </div>

    `;


    const questions =
        exam.questions || [];

    let score = 0;

    const detailedAnswers = [];


    questions.forEach(q => {

        const studentAnswer =
            answers[q.id] || null;

        const isCorrect =
            studentAnswer === q.correctAnswer;

        if (isCorrect) {

            score += Number(q.points) || 1;

        }

        detailedAnswers.push({

            questionId: q.id,

            studentAnswer,

            correctAnswer: q.correctAnswer,

            isCorrect

        });

    });


    const total =
        exam.totalPoints ||
        questions.reduce(
            (sum,q) => sum + (Number(q.points) || 1),
            0
        );

    const percentage =
        total > 0 ? (score / total) * 100 : 0;


    try {

        await addDoc(

            collection(db, "attempts"),

            {

                studentId: currentUser.uid,

                studentName: studentData.name || "",

                examId: exam.id,

                examTitle: exam.title || "",

                grade: exam.grade || studentData.grade || "",

                score,

                total,

                percentage,

                answers: detailedAnswers,

                autoSubmitted: Boolean(autoSubmitted),

                createdAt: serverTimestamp()

            }

        );


        renderResult(score, total, percentage, detailedAnswers);


    } catch (error) {

        console.error(error);

        container.innerHTML = `

            <div class="empty">

                <i class="fas fa-triangle-exclamation"></i>

                <strong>تعذر حفظ نتيجتك</strong>

                <span style="display:block;margin-top:6px;font-size:9px">
                    تأكد من الاتصال بالإنترنت وحاول مرة أخرى.
                </span>

            </div>

        `;

        submitted = false;

    }

}


/* =========================================
   RENDER RESULT
========================================= */

function renderResult(score, total, percentage, detailedAnswers) {

    const container =
        document.getElementById("examContainer");

    const rounded =
        Math.round(percentage);

    const passed =
        rounded >= (exam.passPercent || 50);


    const questions =
        exam.questions || [];


    const reviewHtml =
        questions.map((q, index) => {

            const answer =
                (detailedAnswers || []).find(a => a.questionId === q.id) || {};

            const isCorrect =
                Boolean(answer.isCorrect);

            const options = [

                ["A", "أ", q.options?.A],
                ["B", "ب", q.options?.B],
                ["C", "ج", q.options?.C],
                ["D", "د", q.options?.D]

            ];

            return `

                <div class="question-card" style="margin-top:12px;border-right:4px solid ${isCorrect ? "#10b981" : "#e11d48"}">

                    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">

                        <span style="
                            width:26px;height:26px;border-radius:9px;
                            display:flex;align-items:center;justify-content:center;
                            background:${isCorrect ? "#dcfce7" : "#fff1f2"};
                            color:${isCorrect ? "#059669" : "#e11d48"};
                            font-size:10px;font-weight:900;flex:0 0 26px;">

                            <i class="fas ${isCorrect ? "fa-check" : "fa-xmark"}"></i>

                        </span>

                        <span style="font-size:9px;font-weight:900;color:#94a3b8">
                            السؤال ${index + 1}
                        </span>

                    </div>

                    <div class="question-text" style="font-size:11px">
                        ${escapeHtml(q.text || "")}
                    </div>

                    <div class="options" style="margin-top:12px">

                        ${options.map(o => {

                            const isCorrectOption = q.correctAnswer === o[0];
                            const isStudentChoice = answer.studentAnswer === o[0];

                            let style = "";
                            let icon = "";

                            if (isCorrectOption) {

                                style = "background:#ecfdf5;border-color:#10b981";
                                icon = ' <i class="fas fa-check" style="color:#059669"></i>';

                            }

                            if (isStudentChoice && !isCorrectOption) {

                                style = "background:#fff1f2;border-color:#e11d48";
                                icon = ' <i class="fas fa-xmark" style="color:#e11d48"></i>';

                            }

                            return `

                                <div class="option" style="cursor:default;${style}">

                                    <div class="option-letter">
                                        ${o[1]}
                                    </div>

                                    <div class="option-text">
                                        ${escapeHtml(o[2] || "")}
                                        ${isStudentChoice ? ' <span style="color:#64748b;font-size:8px">(إجابتك)</span>' : ""}
                                        ${icon}
                                    </div>

                                </div>

                            `;

                        }).join("")}

                        ${
                            !answer.studentAnswer
                            ? `<div style="font-size:9px;color:#c2410c;font-weight:800;margin-top:4px">
                                 <i class="fas fa-circle-exclamation"></i>
                                 لم تُجب على هذا السؤال
                               </div>`
                            : ""
                        }

                    </div>

                </div>

            `;

        }).join("");


    container.innerHTML = `

        <div class="question-card" style="text-align:center">

            <div style="
                width:80px;height:80px;margin:0 auto 18px;
                border-radius:50%;display:flex;
                align-items:center;justify-content:center;
                background:${passed ? "#ecfdf5" : "#fff1f2"};
                color:${passed ? "#059669" : "#e11d48"};
                font-size:32px;">

                <i class="fas ${passed ? "fa-trophy" : "fa-circle-exclamation"}"></i>

            </div>

            <div style="font-size:26px;font-weight:900;color:${passed ? "#059669" : "#e11d48"}">
                ${rounded}%
            </div>

            <div style="font-size:11px;font-weight:800;color:#64748b;margin-top:5px">
                ${score} من ${total} درجة
            </div>

            <div style="font-size:10px;font-weight:800;color:#94a3b8;margin-top:14px">
                ${passed ? "أحسنت! لقد اجتزت الاختبار 🎉" : "حاول المذاكرة أكثر في المرة القادمة"}
            </div>

            <button
                class="nav-btn nav-next"
                style="margin-top:22px;width:100%"
                onclick="window.location.href='student-dashboard.html'">

                الرجوع للوحة الطالب

            </button>

        </div>


        <div style="text-align:center;margin:22px 0 6px;font-size:11px;font-weight:900;color:#1e293b">
            <i class="fas fa-list-check"></i>
            مراجعة إجاباتك
        </div>

        ${reviewHtml}

    `;

}


/* =========================================
   ESCAPE
========================================= */

function escapeHtml(text) {

    return String(text)

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================
   HIDE LOADER
========================================= */

function hideLoader() {

    const loader =
        document.getElementById("pageLoader");

    loader.style.display = "none";

}

</script>
