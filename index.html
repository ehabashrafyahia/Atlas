<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#10b981">

    <title>Atlas Platform | منصة أطلس</title>

    <!-- ==============================
         Tailwind
    =============================== -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ==============================
         Google Fonts
    =============================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Reem+Kufi:wght@500;600;700&display=swap"
          rel="stylesheet">

    <!-- ==============================
         Font Awesome
    =============================== -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- ==============================
         SweetAlert
    =============================== -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            min-height: 100%;
            background: #f8fafc;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Cairo', sans-serif;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(16,185,129,.12),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom left,
                    rgba(5,150,105,.08),
                    transparent 35%
                ),
                #f8fafc;

            color: #172033;
            overflow-x: hidden;
        }

        button,
        input {
            font-family: inherit;
        }


        /* =====================================
           SPLASH
        ===================================== */

        #splash {
            position: fixed;
            inset: 0;
            z-index: 9999;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ffffff;

            transition:
                opacity .7s ease,
                visibility .7s ease;
        }

        #splash.hide {
            opacity: 0;
            visibility: hidden;
        }

        .splash-content {
            text-align: center;
            animation: splashEnter .8s ease;
        }

        @keyframes splashEnter {

            from {
                opacity: 0;
                transform: translateY(20px) scale(.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }


        /* =====================================
           LOGO
        ===================================== */

        .logo {
            position: relative;

            width: 125px;
            height: 100px;

            margin: auto;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-shape {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    135deg,
                    #10b981,
                    #059669
                );

            border-radius:
                32% 68% 64% 36% /
                38% 38% 62% 62%;

            box-shadow:
                0 20px 45px rgba(16,185,129,.25);

            animation: morph 6s linear infinite;
        }

        @keyframes morph {

            0%,
            100% {
                border-radius:
                    32% 68% 64% 36% /
                    38% 38% 62% 62%;
            }

            50% {
                border-radius:
                    50% 50% 35% 65% /
                    55% 30% 70% 45%;
            }

        }

        .logo-text {
            position: relative;
            z-index: 2;

            color: white;

            font-family: 'Reem Kufi', sans-serif;

            font-size: 2.6rem;
            font-weight: 700;
        }


        /* =====================================
           SPLASH TEXT
        ===================================== */

        .splash-title {

            margin-top: 25px;

            font-size: 22px;
            font-weight: 900;

            color: #172033;
        }

        .splash-subtitle {

            margin-top: 5px;

            font-size: 11px;
            font-weight: 700;

            color: #94a3b8;
        }

        .loading {

            width: 120px;
            height: 4px;

            margin: 25px auto 0;

            background: #e2e8f0;

            border-radius: 20px;

            overflow: hidden;
        }

        .loading::after {

            content: "";

            display: block;

            width: 50%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    #10b981,
                    #059669
                );

            border-radius: 20px;

            animation: loading 1.3s infinite;
        }

        @keyframes loading {

            0% {
                transform: translateX(-200%);
            }

            100% {
                transform: translateX(300%);
            }

        }


        /* =====================================
           LOGIN WRAPPER
        ===================================== */

        .page {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;

            opacity: 0;

            transform: translateY(15px);

            transition:
                opacity .7s ease,
                transform .7s ease;
        }

        .page.show {

            opacity: 1;

            transform: translateY(0);
        }


        /* =====================================
           LOGIN CARD
        ===================================== */

        .login-card {

            width: 100%;
            max-width: 430px;

            background:
                rgba(255,255,255,.90);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            border:
                1px solid rgba(255,255,255,.8);

            border-radius: 32px;

            padding: 32px 25px;

            box-shadow:
                0 25px 70px rgba(15,23,42,.08);
        }


        /* =====================================
           HEADER
        ===================================== */

        .brand {

            text-align: center;

            margin-bottom: 28px;
        }

        .brand .logo {

            width: 90px;
            height: 72px;

            margin-bottom: 18px;
        }

        .brand .logo-text {

            font-size: 1.9rem;
        }

        .brand h1 {

            margin: 0;

            font-size: 23px;

            font-weight: 900;

            color: #172033;
        }

        .brand p {

            margin-top: 6px;

            font-size: 11px;

            font-weight: 700;

            color: #94a3b8;
        }


        /* =====================================
           INPUT
        ===================================== */

        .field {

            position: relative;

            margin-bottom: 15px;
        }

        .field-icon {

            position: absolute;

            right: 17px;

            top: 50%;

            transform: translateY(-50%);

            color: #94a3b8;

            font-size: 14px;

            pointer-events: none;
        }

        .input {

            width: 100%;

            height: 58px;

            border: 2px solid transparent;

            outline: none;

            border-radius: 18px;

            background: #f1f5f9;

            padding:
                0 48px 0 48px;

            font-size: 13px;

            font-weight: 700;

            color: #172033;

            transition: .25s ease;
        }

        .input::placeholder {

            color: #94a3b8;
        }

        .input:focus {

            background: #ffffff;

            border-color: #10b981;

            box-shadow:
                0 8px 25px rgba(16,185,129,.08);
        }


        /* =====================================
           PASSWORD BUTTON
        ===================================== */

        .password-toggle {

            position: absolute;

            left: 14px;

            top: 50%;

            transform: translateY(-50%);

            width: 34px;
            height: 34px;

            border: 0;

            background: transparent;

            color: #94a3b8;

            cursor: pointer;

            border-radius: 10px;
        }

        .password-toggle:active {

            transform:
                translateY(-50%)
                scale(.9);
        }


        /* =====================================
           LOGIN BUTTON
        ===================================== */

        .login-button {

            width: 100%;

            height: 58px;

            margin-top: 5px;

            border: 0;

            border-radius: 18px;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #10b981,
                    #059669
                );

            color: white;

            font-size: 14px;

            font-weight: 900;

            box-shadow:
                0 12px 28px rgba(16,185,129,.22);

            transition: .25s ease;
        }

        .login-button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 16px 32px rgba(16,185,129,.28);
        }

        .login-button:active {

            transform: scale(.98);
        }

        .login-button.loading {

            pointer-events: none;

            opacity: .75;
        }


        /* =====================================
           FOOTER
        ===================================== */

        .footer {

            margin-top: 25px;

            padding-top: 20px;

            border-top:
                1px dashed #e2e8f0;

            text-align: center;
        }

        .footer p {

            margin: 0;

            font-size: 10px;

            color: #94a3b8;

            font-weight: 700;
        }

        .footer strong {

            color: #10b981;

            font-weight: 900;
        }


        /* =====================================
           RESPONSIVE
        ===================================== */

        @media (min-width: 700px) {

            .login-card {

                padding: 42px 35px;

            }

        }

    </style>
</head>


<body>


<!-- =========================================
     SPLASH
========================================= -->

<div id="splash">

    <div class="splash-content">

        <div class="logo">

            <div class="logo-shape"></div>

            <div class="logo-text">
                أطلس
            </div>

        </div>

        <div class="splash-title">
            منصة أطلس التعليمية
        </div>

        <div class="splash-subtitle">
            طريقك نحو القمة
        </div>

        <div class="loading"></div>

    </div>

</div>



<!-- =========================================
     LOGIN PAGE
========================================= -->

<main class="page" id="page">

    <section class="login-card">


        <div class="brand">

            <div class="logo">

                <div class="logo-shape"></div>

                <div class="logo-text">
                    أطلس
                </div>

            </div>

            <h1>
                أهلاً بك في أطلس 👋
            </h1>

            <p>
                سجّل دخولك للمتابعة إلى منصتك التعليمية
            </p>

        </div>



        <!-- EMAIL -->

        <div class="field">

            <i class="fas fa-envelope field-icon"></i>

            <input
                id="email"
                class="input"
                type="email"
                placeholder="البريد الإلكتروني"
                autocomplete="email">

        </div>



        <!-- PASSWORD -->

        <div class="field">

            <i class="fas fa-lock field-icon"></i>

            <input
                id="password"
                class="input"
                type="password"
                placeholder="كلمة المرور"
                autocomplete="current-password">

            <button
                type="button"
                class="password-toggle"
                id="togglePassword"
                aria-label="إظهار كلمة المرور">

                <i class="fas fa-eye"></i>

            </button>

        </div>



        <!-- LOGIN -->

        <button
            class="login-button"
            id="loginButton">

            <span id="loginText">
                دخول المنصة
            </span>

            <i class="fas fa-arrow-left mr-2"></i>

        </button>



        <div class="footer">

            <p>
                إعداد وتصميم
                <strong>
                    أ. إيهاب أشرف
                </strong>
            </p>

        </div>

    </section>

</main>



<!-- =========================================
     FIREBASE LOGIN
========================================= -->

<script type="module">

    import {
        auth,
        db
    } from "./firebase.js";

    import {
        signInWithEmailAndPassword,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
        doc,
        getDoc
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* =========================================
       ELEMENTS
    ========================================= */

    const splash =
        document.getElementById("splash");

    const page =
        document.getElementById("page");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const loginButton =
        document.getElementById("loginButton");

    const loginText =
        document.getElementById("loginText");

    const togglePassword =
        document.getElementById("togglePassword");


    /* =========================================
       SPLASH
    ========================================= */

    window.addEventListener("load", () => {

        setTimeout(() => {

            splash.classList.add("hide");

            setTimeout(() => {

                page.classList.add("show");

            }, 250);

        }, 1500);

    });


    /* =========================================
       SHOW / HIDE PASSWORD
    ========================================= */

    togglePassword.addEventListener("click", () => {

        const isPassword =
            passwordInput.type === "password";

        passwordInput.type =
            isPassword ? "text" : "password";

        togglePassword.innerHTML =
            isPassword
                ? '<i class="fas fa-eye-slash"></i>'
                : '<i class="fas fa-eye"></i>';

    });


    /* =========================================
       LOGIN
    ========================================= */

    loginButton.addEventListener("click", async () => {

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if (!email || !password) {

            Swal.fire({
                icon: "warning",
                title: "بيانات ناقصة",
                text: "اكتب البريد الإلكتروني وكلمة المرور.",
                confirmButtonText: "حسنًا",
                confirmButtonColor: "#10b981"
            });

            return;
        }


        loginButton.classList.add("loading");

        loginText.innerText =
            "جاري تسجيل الدخول...";


        try {

            const credential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const uid =
                credential.user.uid;


            /*
             * قراءة بيانات المستخدم
             * من Firestore
             */

            const userRef =
                doc(db, "users", uid);

            const userSnap =
                await getDoc(userRef);


            if (!userSnap.exists()) {

                throw new Error(
                    "USER_PROFILE_NOT_FOUND"
                );

            }


            const userData =
                userSnap.data();


            /*
             * تخزين بيانات بسيطة
             * للواجهة فقط
             */

            sessionStorage.setItem(
                "atlas_user",
                JSON.stringify({
                    uid: uid,
                    email: credential.user.email,
                    name: userData.name || "",
                    role: userData.role || "student",
                    grade: userData.grade || null
                })
            );


            await Swal.fire({

                icon: "success",

                title: "تم تسجيل الدخول",

                text:
                    `أهلاً بك ${userData.name || ""}`,

                confirmButtonText:
                    "متابعة",

                confirmButtonColor:
                    "#10b981",

                timer: 1300,

                timerProgressBar: true

            });


            /*
             * تحديد الصفحة حسب الدور
             */

            if (userData.role === "admin") {

                window.location.href =
                    "dashboard.html";

            } else {

                window.location.href =
                    "home.html";

            }


        } catch (error) {

            console.error(error);


            let message =
                "حدث خطأ أثناء تسجيل الدخول.";


            if (
                error.code ===
                "auth/invalid-credential"
            ) {

                message =
                    "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

            } else if (
                error.code ===
                "auth/user-disabled"
            ) {

                message =
                    "هذا الحساب تم تعطيله.";

            } else if (
                error.code ===
                "auth/too-many-requests"
            ) {

                message =
                    "تم إجراء محاولات كثيرة. حاول مرة أخرى لاحقًا.";

            } else if (
                error.message ===
                "USER_PROFILE_NOT_FOUND"
            ) {

                message =
                    "تم تسجيل الدخول، لكن بيانات الحساب غير موجودة في قاعدة البيانات.";

            }


            Swal.fire({

                icon: "error",

                title: "تعذر تسجيل الدخول",

                text: message,

                confirmButtonText:
                    "حاول مرة أخرى",

                confirmButtonColor:
                    "#10b981"

            });

        } finally {

            loginButton.classList.remove("loading");

            loginText.innerText =
                "دخول المنصة";

        }

    });


    /* =========================================
       ENTER KEY
    ========================================= */

    passwordInput.addEventListener(
        "keydown",
        (event) => {

            if (event.key === "Enter") {

                loginButton.click();

            }

        }
    );


</script>

</body>
</html>
