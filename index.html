<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#10b981">

    <title>Atlas | تسجيل الدخول</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Reem+Kufi:wght@600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background:
                radial-gradient(
                    circle at 20% 10%,
                    rgba(16,185,129,.12),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(5,150,105,.08),
                    transparent 30%
                ),
                #f8fafc;

            overflow: hidden;
        }

        /* =========================
           SPLASH
        ========================= */

        #splash {
            position: fixed;
            inset: 0;

            z-index: 9999;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            background: #ffffff;

            transition:
                opacity .7s ease,
                visibility .7s ease;
        }

        .atlas-logo {
            position: relative;

            width: 145px;
            height: 115px;

            display: flex;
            align-items: center;
            justify-content: center;

            animation:
                logoFloat 2.5s ease-in-out infinite;
        }

        .logo-shape {
            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    135deg,
                    #34d399,
                    #10b981 45%,
                    #047857
                );

            border-radius:
                35% 65% 65% 35%
                /
                35% 35% 65% 65%;

            box-shadow:
                0 25px 55px rgba(16,185,129,.28);

            animation:
                morph 7s ease-in-out infinite;
        }

        .logo-text {
            position: relative;

            z-index: 2;

            color: white;

            font-family: 'Reem Kufi', sans-serif;

            font-size: 42px;

            font-weight: 700;

            text-shadow:
                0 4px 12px rgba(0,0,0,.12);
        }

        .splash-title {
            margin-top: 30px;

            font-size: 22px;

            font-weight: 900;

            color: #0f172a;
        }

        .splash-subtitle {
            margin-top: 4px;

            font-size: 11px;

            color: #94a3b8;

            font-weight: 700;
        }

        .loader {
            margin-top: 25px;

            width: 80px;
            height: 4px;

            border-radius: 10px;

            background: #e2e8f0;

            overflow: hidden;
        }

        .loader::after {
            content: "";

            display: block;

            width: 35%;

            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    #10b981,
                    #34d399
                );

            border-radius: inherit;

            animation:
                loading 1.2s infinite ease-in-out;
        }

        /* =========================
           LOGIN
        ========================= */

        #app {
            min-height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 20px;

            opacity: 0;

            transform: translateY(20px);

            transition:
                opacity .7s ease,
                transform .7s ease;
        }

        .login-card {

            width: 100%;
            max-width: 420px;

            padding: 30px 28px 25px;

            background:
                rgba(255,255,255,.90);

            border:
                1px solid rgba(226,232,240,.9);

            border-radius: 34px;

            box-shadow:
                0 25px 70px rgba(15,23,42,.08);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);
        }

        .login-logo {

            width: 92px;
            height: 74px;

            margin: 0 auto 18px;

            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-logo .logo-shape {
            box-shadow:
                0 15px 35px rgba(16,185,129,.20);
        }

        .login-logo .logo-text {

            font-size: 28px;
        }

        .welcome {

            text-align: center;

            font-size: 21px;

            font-weight: 900;

            color: #0f172a;

            margin: 0;
        }

        .description {

            text-align: center;

            color: #94a3b8;

            font-size: 10px;

            font-weight: 700;

            margin:
                5px 0 22px;
        }

        /* =========================
           TABS
        ========================= */

        .tabs {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 6px;

            background: #f1f5f9;

            border-radius: 16px;

            padding: 5px;

            margin-bottom: 22px;
        }

        .tab {

            border: 0;

            border-radius: 12px;

            padding: 11px 8px;

            background: transparent;

            color: #64748b;

            font-family: inherit;

            font-size: 11px;

            font-weight: 900;

            cursor: pointer;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 6px;

            transition: .2s;
        }

        .tab.active {

            background: white;

            color: #059669;

            box-shadow:
                0 6px 16px rgba(15,23,42,.08);
        }

        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        /* =========================
           STUDENT PANEL
        ========================= */

        .code-field {

            position: relative;

            margin-bottom: 15px;
        }

        .code-field input {

            width: 100%;

            height: 72px;

            border: 2px solid #eef2f7;

            border-radius: 20px;

            outline: none;

            background: #f8fafc;

            padding: 0 16px;

            font-family: inherit;

            font-size: 26px;

            font-weight: 900;

            letter-spacing: 10px;

            text-align: center;

            direction: ltr;

            transition: .25s;
        }

        .code-field input:focus {

            background: white;

            border-color: #10b981;

            box-shadow:
                0 10px 25px rgba(16,185,129,.08);
        }

        .code-field input::placeholder {

            letter-spacing: normal;

            font-size: 12px;

            font-weight: 700;

        }

        /* =========================
           TEACHER PANEL
        ========================= */

        .field {

            position: relative;

            margin-bottom: 13px;
        }

        .field input {

            width: 100%;

            height: 58px;

            border: 2px solid #eef2f7;

            border-radius: 17px;

            outline: none;

            background: #f8fafc;

            padding:
                0 48px
                0 16px;

            font-family: inherit;

            font-size: 12px;

            font-weight: 700;

            transition: .25s;
        }

        .field input:focus {

            background: white;

            border-color: #10b981;

            box-shadow:
                0 10px 25px rgba(16,185,129,.08);
        }

        .field i {

            position: absolute;

            right: 18px;

            top: 50%;

            transform:
                translateY(-50%);

            color: #94a3b8;

            font-size: 14px;
        }

        .password-toggle {

            position: absolute;

            left: 17px;

            top: 50%;

            transform:
                translateY(-50%);

            border: 0;

            background: transparent;

            color: #94a3b8;

            cursor: pointer;
        }

        /* =========================
           SHARED
        ========================= */

        .login-button {

            width: 100%;

            height: 58px;

            margin-top: 6px;

            border: 0;

            border-radius: 17px;

            background:
                linear-gradient(
                    135deg,
                    #10b981,
                    #059669
                );

            color: white;

            font-family: inherit;

            font-size: 12px;

            font-weight: 900;

            cursor: pointer;

            box-shadow:
                0 15px 30px rgba(16,185,129,.20);

            transition: .2s;
        }

        .login-button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 18px 35px rgba(16,185,129,.27);
        }

        .login-button:active {

            transform:
                scale(.98);
        }

        .login-button:disabled {

            opacity: .65;

            cursor: not-allowed;

            transform: none;
        }

        .footer {

            margin-top: 22px;

            padding-top: 18px;

            border-top:
                1px dashed #e2e8f0;

            text-align: center;
        }

        .footer p {

            margin: 0;

            font-size: 9px;

            color: #94a3b8;

            font-weight: 700;
        }

        .footer strong {

            color: #059669;
        }

        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes morph {

            0%,
            100% {

                border-radius:
                    35% 65% 65% 35%
                    /
                    35% 35% 65% 65%;
            }

            50% {

                border-radius:
                    60% 40% 35% 65%
                    /
                    45% 60% 40% 55%;
            }
        }

        @keyframes logoFloat {

            0%,
            100% {
                transform:
                    translateY(0);
            }

            50% {
                transform:
                    translateY(-7px);
            }
        }

        @keyframes loading {

            0% {
                transform:
                    translateX(300%);
            }

            100% {
                transform:
                    translateX(-300%);
            }
        }

        @media (max-width: 420px) {

            .login-card {
                padding:
                    26px 20px 22px;
            }

            .welcome {
                font-size: 19px;
            }

            .code-field input {
                font-size: 22px;
                letter-spacing: 7px;
            }

        }

    </style>
</head>

<body>

<!-- =========================
     SPLASH
========================= -->

<div id="splash">

    <div class="atlas-logo">

        <div class="logo-shape"></div>

        <div class="logo-text">
            أطلس
        </div>

    </div>

    <div class="splash-title">
        أهلاً بك في منصة أطلس
    </div>

    <div class="splash-subtitle">
        منصة مستر إيهاب أشرف للدراسات الاجتماعية
    </div>

    <div class="loader"></div>

</div>


<!-- =========================
     LOGIN APP
========================= -->

<main id="app">

    <div class="login-card">

        <div class="login-logo">

            <div class="logo-shape"></div>

            <div class="logo-text">
                أطلس
            </div>

        </div>

        <h1 class="welcome">
            أهلاً بك 👋
        </h1>

        <p class="description">
            اختر نوع حسابك وسجّل دخولك لمنصة Atlas
        </p>


        <!-- TABS -->

        <div class="tabs">

            <button
                type="button"
                class="tab active"
                id="studentTabBtn"
                onclick="switchTab('student')">

                <i class="fas fa-user-graduate"></i>
                طالب

            </button>

            <button
                type="button"
                class="tab"
                id="teacherTabBtn"
                onclick="switchTab('teacher')">

                <i class="fas fa-user-tie"></i>
                معلم

            </button>

        </div>


        <!-- =========================
             STUDENT PANEL
        ========================= -->

        <div
            id="studentPanel"
            class="panel active">

            <div class="code-field">

                <input
                    type="text"
                    id="loginCode"
                    inputmode="numeric"
                    maxlength="6"
                    placeholder="000000"
                    autocomplete="off"
                >

            </div>


            <button
                id="studentLoginButton"
                class="login-button"
                onclick="studentLogin()">

                <i class="fas fa-right-to-bracket"></i>

                دخول

            </button>

        </div>


        <!-- =========================
             TEACHER PANEL
        ========================= -->

        <div
            id="teacherPanel"
            class="panel">

            <div class="field">

                <i class="fas fa-envelope"></i>

                <input
                    type="email"
                    id="email"
                    placeholder="البريد الإلكتروني"
                    autocomplete="email"
                >

            </div>


            <div class="field">

                <i class="fas fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    placeholder="كلمة المرور"
                    autocomplete="current-password"
                >

                <button
                    type="button"
                    class="password-toggle"
                    onclick="togglePassword()">

                    <i
                        id="passwordIcon"
                        class="fas fa-eye">
                    </i>

                </button>

            </div>


            <button
                id="teacherLoginButton"
                class="login-button"
                onclick="teacherLogin()">

                <i class="fas fa-right-to-bracket"></i>

                دخول المنصة

            </button>

        </div>


        <div class="footer">

            <p>
                إعداد وتصميم
                <strong>
                    أ. إيهاب أشرف
                </strong>
            </p>

        </div>

    </div>

</main>


<script type="module">

    import { auth, db } from "./firebase.js";

    import {
        signInWithEmailAndPassword,
        signOut,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
        doc,
        getDoc
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    const STUDENT_EMAIL_DOMAIN = "atlas-students.app";


    /* =========================
       SPLASH
    ========================= */

    window.addEventListener("load", () => {

        setTimeout(() => {

            const splash =
                document.getElementById("splash");

            const app =
                document.getElementById("app");

            splash.style.opacity = "0";

            splash.style.visibility =
                "hidden";

            app.style.opacity = "1";

            app.style.transform =
                "translateY(0)";

            document
                .getElementById("loginCode")
                .focus();

        }, 1800);

    });


    /* =========================
       TABS
    ========================= */

    window.switchTab = function (tab) {

        const studentTabBtn =
            document.getElementById("studentTabBtn");

        const teacherTabBtn =
            document.getElementById("teacherTabBtn");

        const studentPanel =
            document.getElementById("studentPanel");

        const teacherPanel =
            document.getElementById("teacherPanel");


        if (tab === "student") {

            studentTabBtn.classList.add("active");
            teacherTabBtn.classList.remove("active");

            studentPanel.classList.add("active");
            teacherPanel.classList.remove("active");

            document
                .getElementById("loginCode")
                .focus();

        } else {

            teacherTabBtn.classList.add("active");
            studentTabBtn.classList.remove("active");

            teacherPanel.classList.add("active");
            studentPanel.classList.remove("active");

            document
                .getElementById("email")
                .focus();

        }

    };


    /* =========================
       STUDENT CODE INPUT
    ========================= */

    document
        .getElementById("loginCode")
        .addEventListener("input", event => {

            event.target.value =
                event.target.value
                    .replace(/[^0-9]/g, "")
                    .slice(0, 6);

        });


    document
        .getElementById("loginCode")
        .addEventListener(
            "keydown",
            event => {

                if (event.key === "Enter") {

                    studentLogin();

                }

            }
        );


    /* =========================
       STUDENT LOGIN
    ========================= */

    window.studentLogin = async function () {

        const code =
            document
                .getElementById("loginCode")
                .value
                .trim();

        const button =
            document
                .getElementById("studentLoginButton");


        if (!code || code.length !== 6) {

            Swal.fire({

                icon: "warning",

                title: "كود غير صحيح",

                text:
                    "اكتب كود الدخول المكوّن من 6 أرقام.",

                confirmButtonColor:
                    "#10b981"

            });

            return;
        }


        button.disabled = true;

        button.innerHTML = `
            <i class="fas fa-spinner fa-spin"></i>
            جاري تسجيل الدخول...
        `;


        const fakeEmail =
            `${code}@${STUDENT_EMAIL_DOMAIN}`;


        try {

            const result =
                await signInWithEmailAndPassword(
                    auth,
                    fakeEmail,
                    code
                );


            const userSnap =
                await getDoc(
                    doc(db, "users", result.user.uid)
                );


            if (
                !userSnap.exists() ||
                userSnap.data().role !== "student"
            ) {

                await signOut(auth);

                Swal.fire({

                    icon: "error",

                    title: "كود غير صالح",

                    text:
                        "هذا الكود غير مرتبط بحساب طالب.",

                    confirmButtonColor:
                        "#10b981"

                });

                resetStudentButton();

                return;

            }


            if (userSnap.data().active === false) {

                await signOut(auth);

                Swal.fire({

                    icon: "error",

                    title: "الحساب غير مفعّل",

                    text:
                        "تواصل مع المدرّس لتفعيل حسابك.",

                    confirmButtonColor:
                        "#10b981"

                });

                resetStudentButton();

                return;

            }


            await Swal.fire({

                icon: "success",

                title: "تم الدخول بنجاح 🎉",

                text:
                    `أهلاً بك ${userSnap.data().name || ""}`,

                showConfirmButton: false,

                timer: 1200

            });


            window.location.href =
                "student-dashboard.html";


        } catch (error) {

            console.error(error);


            let message =
                "الكود غير صحيح أو غير مسجل.";


            if (
                error.code ===
                "auth/too-many-requests"
            ) {

                message =
                    "تم إجراء محاولات كثيرة. حاول مرة أخرى لاحقاً.";

            }


            Swal.fire({

                icon: "error",

                title: "تعذر تسجيل الدخول",

                text: message,

                confirmButtonColor:
                    "#10b981"

            });


            resetStudentButton();

        }


        function resetStudentButton() {

            button.disabled = false;

            button.innerHTML = `
                <i class="fas fa-right-to-bracket"></i>
                دخول
            `;

        }

    };


    /* =========================
       PASSWORD TOGGLE
    ========================= */

    window.togglePassword = function () {

        const password =
            document.getElementById("password");

        const icon =
            document.getElementById("passwordIcon");

        if (password.type === "password") {

            password.type = "text";

            icon.className =
                "fas fa-eye-slash";

        } else {

            password.type = "password";

            icon.className =
                "fas fa-eye";

        }

    };


    /* =========================
       TEACHER LOGIN
    ========================= */

    window.teacherLogin = async function () {

        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;

        const button =
            document
                .getElementById("teacherLoginButton");


        if (!email || !password) {

            Swal.fire({

                icon: "warning",

                title: "بيانات ناقصة",

                text:
                    "اكتب البريد الإلكتروني وكلمة المرور.",

                confirmButtonColor:
                    "#10b981"

            });

            return;
        }


        button.disabled = true;

        button.innerHTML = `
            <i class="fas fa-spinner fa-spin"></i>
            جاري تسجيل الدخول...
        `;


        try {

            const result =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            await Swal.fire({

                icon: "success",

                title: "تم الدخول بنجاح 🎉",

                text:
                    "مرحباً بك في Atlas Platform",

                showConfirmButton: false,

                timer: 1200

            });


            window.location.href =
                "dashboard.html";


        } catch (error) {

            console.error(error);


            let message =
                "حدث خطأ أثناء تسجيل الدخول.";


            if (
                error.code ===
                "auth/invalid-credential"
            ) {

                message =
                    "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

            }

            else if (
                error.code ===
                "auth/user-not-found"
            ) {

                message =
                    "لا يوجد حساب بهذا البريد الإلكتروني.";

            }

            else if (
                error.code ===
                "auth/wrong-password"
            ) {

                message =
                    "كلمة المرور غير صحيحة.";

            }

            else if (
                error.code ===
                "auth/invalid-email"
            ) {

                message =
                    "البريد الإلكتروني غير صحيح.";

            }

            else if (
                error.code ===
                "auth/too-many-requests"
            ) {

                message =
                    "تم إجراء محاولات كثيرة. حاول مرة أخرى لاحقاً.";

            }


            Swal.fire({

                icon: "error",

                title: "تعذر تسجيل الدخول",

                text: message,

                confirmButtonColor:
                    "#10b981"

            });


            button.disabled = false;

            button.innerHTML = `
                <i class="fas fa-right-to-bracket"></i>
                دخول المنصة
            `;

        }

    };


    document
        .getElementById("password")
        .addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter"
                ) {

                    teacherLogin();

                }

            }
        );


    /* =========================
       AUTH STATE
    ========================= */

    onAuthStateChanged(
        auth,
        user => {

            if (user) {

                // لا نحول تلقائياً هنا
                // حتى لا يحدث Loop أثناء فتح الصفحة.
                // كل من dashboard.html و student-dashboard.html
                // يتحقق بنفسه من صلاحية المستخدم (admin / student).

                console.log(
                    "Atlas user:",
                    user.email
                );

            }

        }
    );

</script>

</body>

</html>
